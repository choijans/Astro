<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 690" width="1060" height="690" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Astro Channel Management Portal: architecture</title>
  <desc id="d">The frontend calls the NestJS API over REST. The API reads PostgreSQL and uses Redis for the job queue and the response cache. A separate worker takes jobs from Redis, writes PostgreSQL and calls the Astro API for refreshes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #1e293b; }
      .title { font-size: 20px; font-weight: 700; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .fe { fill: #fdf2f8; stroke: #E6007D; stroke-width: 2; }
      .api { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .wk { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .db { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
      .rd { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
      .ext { fill: #f8fafc; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 4; }
      .h { font-size: 15px; font-weight: 700; }
      .s { font-size: 12.5px; fill: #334155; }
      .lbl { font-size: 11.5px; fill: #475569; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #475569; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="30" y="32" class="title">Astro Channel Management Portal: architecture</text>

  <!-- Row 1 -->
  <rect x="30" y="55" width="270" height="150" rx="10" class="fe"/>
  <text x="46" y="80" class="h">Frontend: Next.js + React</text>
  <text x="46" y="106" class="s">Pages: list, details, favourites</text>
  <text x="46" y="126" class="s">URL holds search, sort and filters</text>
  <text x="46" y="146" class="s">Zustand + TanStack Query</text>
  <text x="46" y="166" class="s">Command polling, pending overlay</text>
  <text x="46" y="186" class="s">Offline outbox (localStorage)</text>

  <rect x="400" y="55" width="300" height="150" rx="10" class="api"/>
  <text x="416" y="80" class="h">Backend API: NestJS</text>
  <text x="416" y="106" class="s">Channels, Favourites, Commands modules</text>
  <text x="416" y="126" class="s">One write path: CommandsService.enqueue</text>
  <text x="416" y="146" class="s">helmet, CORS, validation, rate limiting</text>
  <text x="416" y="166" class="s">GET /health (database + Redis)</text>

  <!-- Row 2 -->
  <rect x="30" y="345" width="270" height="170" rx="10" class="db"/>
  <text x="46" y="370" class="h">PostgreSQL (Prisma)</text>
  <text x="46" y="396" class="s">channels, favourites, commands</text>
  <text x="46" y="416" class="s">Source of truth for every command</text>
  <text x="46" y="436" class="s">Migrations, seed from saved fixture</text>

  <rect x="400" y="345" width="300" height="170" rx="10" class="wk"/>
  <text x="416" y="370" class="h">Worker: separate NestJS process</text>
  <text x="416" y="396" class="s">Handlers: add, remove, refresh</text>
  <text x="416" y="416" class="s">Ordered per user + channel (DB lock)</text>
  <text x="416" y="436" class="s">Retries with exponential backoff</text>
  <text x="416" y="456" class="s">Recovery sweep (start, reconnect, 5 s)</text>
  <text x="416" y="476" class="s">Astro list cache (60 s, in memory)</text>

  <rect x="800" y="345" width="230" height="170" rx="10" class="rd"/>
  <text x="816" y="370" class="h">Redis</text>
  <text x="816" y="396" class="s">BullMQ job queue</text>
  <text x="816" y="416" class="s">Response cache: list + detail</text>
  <text x="816" y="436" class="s">Cache fails open</text>

  <!-- Row 3 -->
  <rect x="800" y="560" width="230" height="90" rx="10" class="ext"/>
  <text x="816" y="585" class="h">Astro content API</text>
  <text x="816" y="607" class="s">External, undocumented</text>
  <text x="816" y="627" class="s">Source of channel data</text>

  <rect x="30" y="560" width="370" height="100" rx="10" class="box"/>
  <text x="46" y="585" class="h">Why nothing is lost in an outage</text>
  <text x="46" y="609" class="s">1. Saved as PENDING before it is queued</text>
  <text x="46" y="629" class="s">2. Command id = job id, so no duplicates</text>
  <text x="46" y="649" class="s">3. Sweep re-queues PENDING and stuck ones</text>

  <!-- Arrows -->
  <path d="M 300 110 L 400 110" class="line"/>
  <text x="350" y="98" text-anchor="middle" class="lbl">REST / JSON</text>
  <text x="350" y="128" text-anchor="middle" class="lbl">X-User-Id</text>

  <path d="M 440 205 L 440 275 L 165 275 L 165 345" class="line"/>
  <text x="300" y="266" text-anchor="middle" class="lbl">read + save command (PENDING)</text>

  <path d="M 660 205 L 660 275 L 915 275 L 915 345" class="line"/>
  <text x="788" y="266" text-anchor="middle" class="lbl">enqueue job (jobId = command id)</text>
  <text x="788" y="294" text-anchor="middle" class="lbl">+ cache-aside reads</text>

  <path d="M 800 495 L 700 495" class="line"/>
  <text x="750" y="485" text-anchor="middle" class="lbl">deliver job</text>

  <path d="M 400 495 L 300 495" class="line"/>
  <text x="350" y="485" text-anchor="middle" class="lbl">apply in tx</text>
  <text x="350" y="512" text-anchor="middle" class="lbl">mark DONE</text>

  <path d="M 550 515 L 550 605 L 800 605" class="dash"/>
  <text x="675" y="595" text-anchor="middle" class="lbl">REFRESH_CHANNEL (HTTPS)</text>
  <text x="675" y="628" text-anchor="middle" class="lbl">shared 60 s copy of the list</text>
</svg>
